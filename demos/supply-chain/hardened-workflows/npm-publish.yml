# Reference: publishing to npm WITHOUT a long-lived NPM_TOKEN.
#  - Trusted publishing (OIDC): npm exchanges a short-lived GitHub OIDC token,
#    so there is no secret in the repo to steal.
#  - Provenance is generated automatically with trusted publishing.
#  - `npm stage publish` (npm >= 11.15) puts the tarball in a stage queue;
#    a maintainer must approve it with 2FA before anyone can install it.
#    Configure the trusted publisher as "stage-only" to forbid direct publishes.
name: Publish to npm

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release          # add required reviewers here too
    permissions:
      contents: read
      id-token: write                 # OIDC for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test --if-present
      - run: npm stage publish
